# Site settings
title:          Sayak Majumder
description:    "Musings of a Physicist."
baseurl:        ""
url:            "https://misalignedink.github.io/"

# Google Analytics
# google_analytics: UA—XXXXXXXX-X

# Author
author:
  name:         Sayak Majumder
  url:          https://misalignedink.github.io/
  email:        contact.misalignedink@gmail.com

# Build settings
markdown:       kramdown
include:
  - _pages

# Assets
sass:
  sass_dir:     _sass
  style:        compressed

# Gems
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  # - jemoji #Uncomment this to allow emoji in your post

# Permalinks
permalink:      /:year-:month-:day/:title


# Excludes
exclude: [ Gemfile, Gemfile.lock, tale.gemspec ]

